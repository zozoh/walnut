<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${status} ${title}</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .card{max-width:560px;padding:40px 48px;border-radius:16px;background:#1e293b;
        box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .status{font-size:64px;font-weight:700;letter-spacing:2px;color:#fb7185;line-height:1}
  h1{margin:8px 0 16px;font-size:22px;font-weight:600}
  p{margin:8px 0;color:#94a3b8;font-size:14px;word-break:break-all}
  a{color:#38bdf8;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="status">${status}</div>
    <h1>${title}</h1>
    <p>${message}</p>
    <p>${path}</p>
    <p><a href="/">返回首页</a></p>
  </div>
</body>
</html>
