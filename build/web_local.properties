#!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# dist conf 模板 —— 构建时由 build/wn4j-make.py 改写生成
#
#   @DIST_HOME@        → 构建产物的绝对路径（build 时替换）
#   @MNT_FILE_ALLOW@   → 自动计算的挂载白名单（Walnut 仓库上两级）
#
# 要改默认行为，改 build/ 目录里这份模板，不要改产物里的生成结果。
#!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
app-root=@DIST_HOME@/WebContent

# 登录模式：智能体测试的硬性前提（见 doc/reference/102.auto-test/20-at-setup.md）
app-module-sys-login=PASSWD_ONLY
app-module-dmn-login=PASSWD_ONLY

# 本实例独立的本地数据桶（不与开发者的目录混用）
global-bm-bucket=@DIST_HOME@/run/buck
global-bm-swap=@DIST_HOME@/run/swap

# 运行时服务（值来自 build/build.rs.json，构建时注入；
# 没有这个文件构建会直接失败 —— 智能体须先向主人确认配置。
# 注意 mongo-db / redis-database 必须与本机其他 Walnut 实例不同：
# 两个实例共用一个 mongo-db 时，一边写的桶文件另一边看不到，
# 任何触碰到对方对象的操作都会炸 e.io.bm.LocalSha1BM.LostBucket）
mongo-host=@MONGO_HOST@
mongo-port=@MONGO_PORT@
mongo-db=@MONGO_DB@
redis-host=@REDIS_HOST@
redis-port=@REDIS_PORT@
redis-database=@REDIS_DB@

# 初始化挂载：指向产物 ROOT 内的内置应用与默认登录页
init-mnt:
/app/wn-term            : file://@DIST_HOME@/ROOT/app/wn-term
/etc/hosts.d/default    : file://@DIST_HOME@/ROOT/etc/hosts.d/default
# ~ End of init-mnt

# 允许挂载的本地目录（构建时自动计算：Walnut 仓库上两级）
mnt-file-allow:
@MNT_FILE_ALLOW@
# ~ End of mnt-file-allow
